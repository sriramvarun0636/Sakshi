[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sakshi"
version = "0.1.0"
description = "SAKSHI: Situational Awareness through Knowledge Synthesis and Human-Interpretable AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "pillow>=10",
    "imagehash>=4.3",
    "ftfy>=6.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.21"]
ml = ["torch>=2.3", "transformers>=4.49", "accelerate>=0.33", "scikit-learn>=1.4", "scipy>=1.11", "pyyaml>=6", "emoji>=2.8", "matplotlib>=3.8"]
xai = ["captum>=0.7", "grad-cam>=1.5", "opencv-python-headless>=4.9"]
aggregate = ["sentence-transformers>=3.0", "scikit-learn>=1.4", "pyyaml>=6", "jsonschema>=4.21", "emoji>=2.8"]
llm = ["ollama>=0.4", "sentence-transformers>=3.0", "jsonschema>=4.21", "qwen-vl-utils", "bitsandbytes>=0.43; platform_system != 'Darwin'", "autoawq; platform_system != 'Darwin'"]
app = ["streamlit>=1.37", "opencv-python-headless>=4.9"]

[project.scripts]
sakshi-data = "sakshi.cli:main"
sakshi-model = "sakshi.model_cli:main"
sakshi-provenance = "sakshi.provenance_cli:main"
sakshi-baselines = "sakshi.baseline_cli:main"
sakshi-aggregate = "sakshi.aggregate_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sakshi = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["SAKSHI_design_spec_v2.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
